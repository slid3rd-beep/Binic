<title>Nos journées en Bretagne</title>
<style>
/* Habillage inspiré des cartes marines du SHOM : fond papier gris-bleu froid,
   encre bleu nuit, accent rouille des bouées et des phares.
   Tokens définis pour les trois états de thème (clair, sombre OS, choix explicite). */

:root {
  /* fond «papier de carte» */
  --bg: #e8edef;
  --card: #fbfcfc;
  --card-alt: #f1f5f6;
  --ink: #0e1c22;
  --ink-soft: #52707c;
  --line: #cfdce0;
  --line-strong: #b3c6cd;

  /* bleu de sonde, accent rouille */
  --sea: #0b4a5e;
  --sea-ink: #ffffff;
  --rust: #b8471f;

  /* prix : vert des amers tribord, désaturé */
  --ok-bg: #e4efe8;
  --ok-line: #bcd8c6;
  --ok-ink: #235f3f;

  --shadow: 0 1px 2px rgba(14, 28, 34, 0.06);
  --radius: 14px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a1317;
    --card: #13232a;
    --card-alt: #182d35;
    --ink: #e6eef1;
    --ink-soft: #8fa9b3;
    --line: #223b44;
    --line-strong: #2e4d58;

    --sea: #6fb4c9;
    --sea-ink: #06171d;
    --rust: #e0764a;

    --ok-bg: #14302a;
    --ok-line: #235141;
    --ok-ink: #7fc99e;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
  }
}

:root[data-theme="dark"] {
  --bg: #0a1317;
  --card: #13232a;
  --card-alt: #182d35;
  --ink: #e6eef1;
  --ink-soft: #8fa9b3;
  --line: #223b44;
  --line-strong: #2e4d58;

  --sea: #6fb4c9;
  --sea-ink: #06171d;
  --rust: #e0764a;

  --ok-bg: #14302a;
  --ok-line: #235141;
  --ok-ink: #7fc99e;

  --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom: calc(24px + var(--safe-b));
}

:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

/* Chiffres alignés partout où ils se comparent : prix, distances, totaux. */
.chip, .spot-price, .total, .calc input, .comment-meta { font-variant-numeric: tabular-nums; }

/* ---------- en-tête : bandeau «titre de carte» ---------- */

.top {
  background: #072f3c;
  color: #ffffff;
  padding: calc(var(--safe-t) + 14px) 16px 0;
  position: sticky;
  top: 0;
  z-index: 20;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
}

.top-inner { display: flex; align-items: flex-start; gap: 12px; }

.top h1 { margin: 0; font-size: 19px; letter-spacing: -0.015em; font-weight: 700; }

.baseline {
  margin: 3px 0 0;
  font-size: 11.5px;
  color: #8fb3bf;
  text-transform: uppercase;
  letter-spacing: 0.09em;
}

.who {
  margin-left: auto;
  background: rgba(255, 255, 255, 0.13);
  border: 1px solid rgba(255, 255, 255, 0.16);
  color: #fff;
  font: inherit;
  font-size: 14px;
  border-radius: 999px;
  padding: 6px 12px;
  cursor: pointer;
  white-space: nowrap;
  max-width: 44vw;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tabs { display: flex; gap: 22px; margin-top: 12px; }

.tab {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: #8fb3bf;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 0 10px;
  cursor: pointer;
}

.tab.is-on { color: #fff; border-bottom-color: var(--rust); }

/* ---------- grille ---------- */

main { padding: 16px; max-width: 940px; margin: 0 auto; }

.grid { display: grid; gap: 14px; }

@media (min-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } }

.card {
  background: var(--card);
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--line);
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  text-align: left;
  padding: 0;
  font: inherit;
  color: inherit;
  width: 100%;
}

.card:active { opacity: 0.85; }

.card-hero {
  padding: 16px 15px 13px;
  color: #fff;
  position: relative;
  min-height: 92px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
}

/* Trame de hachures : le grain des zones de sable sur une carte marine. */
.card-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    rgba(255, 255, 255, 0.09) 0 1px,
    transparent 1px 7px
  );
  pointer-events: none;
}

.card-hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(0, 0, 0, 0) 45%, rgba(0, 0, 0, 0.3));
  pointer-events: none;
}

.card-emoji { position: absolute; top: 11px; right: 13px; font-size: 27px; z-index: 1; }

.card-hero h2 { margin: 0; font-size: 18.5px; position: relative; z-index: 1; letter-spacing: -0.01em; }

.card-hero .sub { font-size: 12.5px; opacity: 0.92; position: relative; z-index: 1; }

.card-body { padding: 12px 15px 14px; display: flex; flex-direction: column; gap: 9px; }

.meta { display: flex; flex-wrap: wrap; gap: 6px; }

.chip {
  font-size: 12px;
  background: var(--card-alt);
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 3px 8px;
  color: var(--ink-soft);
}

.chip.price { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok-ink); font-weight: 650; }

.chip.day {
  background: transparent;
  border-color: var(--rust);
  color: var(--rust);
  font-weight: 650;
}

.card-body p { margin: 0; font-size: 14px; color: var(--ink-soft); }

.card-foot {
  font-size: 12.5px;
  color: var(--ink-soft);
  display: flex;
  gap: 14px;
  border-top: 1px solid var(--line);
  padding-top: 9px;
}

.footnote {
  margin: 22px 2px 0;
  font-size: 12.5px;
  color: var(--ink-soft);
  line-height: 1.65;
  max-width: 62ch;
}

/* ---------- feuille de détail ---------- */

.sheet {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

/* `display:flex` l'emporterait sur la règle par défaut de [hidden] */
.sheet[hidden] { display: none; }

.sheet-scroll {
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  flex: 1;
  padding-bottom: calc(40px + var(--safe-b));
}

.sheet-close {
  position: fixed;
  top: calc(var(--safe-t) + 12px);
  right: 12px;
  z-index: 41;
  width: 38px;
  height: 38px;
  border-radius: 999px;
  border: 1px solid rgba(255, 255, 255, 0.25);
  background: rgba(7, 26, 34, 0.55);
  color: #fff;
  font-size: 16px;
  cursor: pointer;
  backdrop-filter: blur(8px);
}

.detail-hero {
  color: #fff;
  padding: calc(var(--safe-t) + 28px) 18px 22px;
  position: relative;
}

.detail-hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: repeating-linear-gradient(
    -45deg,
    rgba(255, 255, 255, 0.08) 0 1px,
    transparent 1px 8px
  );
}

.detail-hero > * { position: relative; }

.detail-hero h2 { margin: 0; font-size: 25px; letter-spacing: -0.02em; text-wrap: balance; }

.detail-hero .sub { opacity: 0.92; font-size: 13.5px; margin-top: 3px; }

.detail-hero .big-emoji { font-size: 34px; line-height: 1; margin-bottom: 6px; }

.detail-body { padding: 16px 16px 0; max-width: 940px; margin: 0 auto; }

.block {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px 15px;
  margin-bottom: 14px;
}

.block h3 {
  margin: 0 0 11px;
  font-size: 11.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-soft);
  font-weight: 700;
}

.lede { font-size: 15.5px; line-height: 1.65; margin: 0; max-width: 62ch; }

/* liste à voir / tarifs */

.spot { padding: 13px 0; border-top: 1px solid var(--line); }

.spot:first-of-type { border-top: 0; padding-top: 0; }

.spot-head { display: flex; align-items: flex-start; gap: 11px; }

.spot-head input[type="checkbox"] {
  margin-top: 3px;
  width: 21px;
  height: 21px;
  accent-color: var(--sea);
  flex: 0 0 auto;
}

.spot-name { font-weight: 650; font-size: 15px; }

.spot-detail { font-size: 13.5px; color: var(--ink-soft); margin-top: 3px; max-width: 58ch; }

.spot-price {
  display: inline-block;
  margin-top: 8px;
  font-size: 13px;
  font-weight: 650;
  color: var(--ok-ink);
  background: var(--ok-bg);
  border: 1px solid var(--ok-line);
  border-radius: 7px;
  padding: 4px 8px;
}

.spot-price.free {
  color: var(--ink-soft);
  background: var(--card-alt);
  border-color: var(--line);
  font-weight: 500;
}

.spot-link {
  display: inline-block;
  margin-top: 8px;
  margin-left: 8px;
  font-size: 13px;
  color: var(--sea);
  font-weight: 650;
}

/* calculette */

.calc {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 13px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
}

.calc label { font-size: 13.5px; color: var(--ink-soft); }

.calc input[type="number"] {
  width: 64px;
  padding: 7px 8px;
  font: inherit;
  font-size: 16px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: var(--card-alt);
  color: var(--ink);
}

.total {
  margin-top: 13px;
  padding-top: 13px;
  border-top: 2px solid var(--line-strong);
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 16px;
  font-weight: 700;
  font-size: 17px;
}

.total small {
  font-weight: 400;
  color: var(--ink-soft);
  font-size: 12px;
  display: block;
  margin-top: 2px;
}

#total-val { color: var(--rust); font-size: 20px; }

ul.plain { margin: 0; padding-left: 18px; font-size: 14.5px; }

ul.plain li { margin-bottom: 7px; max-width: 60ch; }

.sources li { margin-bottom: 9px; font-size: 14px; }

a { color: var(--sea); }

/* planning */

.day-picker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.day-picker input[type="date"] {
  padding: 9px 10px;
  font: inherit;
  font-size: 16px;
  border: 1px solid var(--line-strong);
  border-radius: 9px;
  background: var(--card-alt);
  color: var(--ink);
}

.btn {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 10px 15px;
  font: inherit;
  font-size: 14.5px;
  font-weight: 650;
  cursor: pointer;
  background: var(--sea);
  color: var(--sea-ink);
}

.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }

/* commentaires */

.comment {
  padding: 12px 0;
  border-top: 1px solid var(--line);
  font-size: 14.5px;
  display: flex;
  gap: 10px;
  align-items: flex-start;
}

.comment:first-of-type { border-top: 0; padding-top: 0; }

.avatar {
  flex: 0 0 auto;
  width: 30px;
  height: 30px;
  border-radius: 999px;
  background: var(--sea);
  color: var(--sea-ink);
  display: grid;
  place-items: center;
  font-size: 13px;
  font-weight: 700;
}

.comment-meta { font-size: 11.5px; color: var(--ink-soft); letter-spacing: 0.02em; }

.comment-body { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 1px; }

.comment-del {
  margin-left: auto;
  background: none;
  border: 0;
  color: var(--ink-soft);
  font-size: 15px;
  cursor: pointer;
  padding: 0 2px;
}

textarea {
  width: 100%;
  min-height: 74px;
  padding: 10px;
  font: inherit;
  font-size: 16px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  resize: vertical;
  background: var(--card-alt);
  color: var(--ink);
}

.empty { color: var(--ink-soft); font-size: 14px; }

/* programme */

.day-group { margin-bottom: 20px; }

.day-title {
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-soft);
  margin: 0 0 9px 2px;
  padding-bottom: 7px;
  border-bottom: 1px solid var(--line);
}

.day-item {
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 4px solid var(--sea);
  border-radius: 11px;
  box-shadow: var(--shadow);
  padding: 12px 14px;
  margin-bottom: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  text-align: left;
  font: inherit;
  color: inherit;
}

.day-item .n { font-weight: 650; }

.day-item .c { margin-left: auto; font-size: 12.5px; color: var(--ink-soft); text-align: right; }

/* badge de synchro */

.sync-badge {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(16px + var(--safe-b));
  background: #072f3c;
  color: #fff;
  font-size: 13px;
  padding: 9px 15px;
  border-radius: 999px;
  z-index: 60;
  max-width: 90vw;
  text-align: center;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
}

</style>

/* ---------------------------------------------------------------
   Nos journées en Bretagne — application statique, sans build.
   État partagé : commentaires + planning, via Firebase Realtime
   Database en REST (voir config.js) ou localStorage en repli.
   --------------------------------------------------------------- */

const LS_STATE = "bretagne.state.v1";
const LS_NAME = "bretagne.prenom";

const state = { comments: {}, plan: {} };
let moi = localStorage.getItem(LS_NAME) || "";
let destOuverte = null;

const remote = typeof SYNC_URL === "string" && SYNC_URL.trim() !== "";
const base = remote ? `${SYNC_URL.replace(/\/$/, "")}/${SYNC_ROOM}` : null;

const $ = (sel) => document.querySelector(sel);

/* ---------------- persistance ---------------- */

function saveLocal() {
  try {
    localStorage.setItem(LS_STATE, JSON.stringify(state));
  } catch (_) {
    /* quota plein : on continue, l'affichage reste correct */
  }
}

function loadLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_STATE) || "{}");
    state.comments = raw.comments || {};
    state.plan = raw.plan || {};
  } catch (_) {
    /* données illisibles : on repart d'un état vide */
  }
}

async function pull() {
  if (!remote) return;
  const res = await fetch(`${base}.json`, { cache: "no-store" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = (await res.json()) || {};
  state.comments = data.comments || {};
  state.plan = data.plan || {};
  saveLocal();
}

async function pushComment(entry) {
  if (!remote) {
    const key = `l${Date.now()}${Math.random().toString(36).slice(2, 7)}`;
    state.comments[key] = entry;
    saveLocal();
    return;
  }
  const res = await fetch(`${base}/comments.json`, {
    method: "POST",
    body: JSON.stringify(entry),
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const { name } = await res.json();
  state.comments[name] = entry;
  saveLocal();
}

async function dropComment(key) {
  delete state.comments[key];
  saveLocal();
  if (!remote) return;
  const res = await fetch(`${base}/comments/${key}.json`, { method: "DELETE" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

async function pushPlan(destId, date) {
  if (date) state.plan[destId] = date;
  else delete state.plan[destId];
  saveLocal();
  if (!remote) return;
  const url = `${base}/plan/${destId}.json`;
  const res = date
    ? await fetch(url, { method: "PUT", body: JSON.stringify(date) })
    : await fetch(url, { method: "DELETE" });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
}

/* ---------------- utilitaires ---------------- */

const euro = (n) =>
  n.toLocaleString("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: n % 1 ? 2 : 0 });

const esc = (s) =>
  String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

function jourLisible(iso) {
  const d = new Date(`${iso}T12:00:00`);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });
}

function quandLisible(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) +
    " · " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" });
}

function commentairesDe(destId) {
  return Object.entries(state.comments)
    .filter(([, c]) => c.dest === destId)
    .sort((a, b) => a[1].ts - b[1].ts);
}

function badge(msg, ms = 2600) {
  const el = $("#sync-badge");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(badge._t);
  badge._t = setTimeout(() => { el.hidden = true; }, ms);
}

function demanderPrenom(force) {
  if (moi && !force) return moi;
  const rep = prompt("Ton prénom (il s'affichera à côté de tes commentaires) :", moi || "");
  if (rep && rep.trim()) {
    moi = rep.trim().slice(0, 24);
    localStorage.setItem(LS_NAME, moi);
    majBoutonPrenom();
  }
  return moi;
}

function majBoutonPrenom() {
  $("#who").textContent = moi ? `👤 ${moi}` : "👤 Qui es-tu ?";
}

/* ---------------- vue liste ---------------- */

function prixMini(dest) {
  const obligatoires = dest.aVoir.filter((s) => !s.prix.optionnel);
  const total = obligatoires.reduce((sum, s) => sum + (s.prix.adulte || 0), 0);
  return total === 0 ? "Gratuit" : `dès ${euro(total)}/adulte`;
}

function renderGrid() {
  $("#grid").innerHTML = DESTINATIONS.map((d) => {
    const nb = commentairesDe(d.id).length;
    const jour = state.plan[d.id];
    return `
      <button class="card" data-dest="${d.id}">
        <div class="card-hero" style="background:${d.couleur}">
          <span class="card-emoji">${d.emoji}</span>
          <h2>${esc(d.nom)}</h2>
          <div class="sub">${esc(d.sousTitre)}</div>
        </div>
        <div class="card-body">
          <div class="meta">
            <span class="chip price">${prixMini(d)}</span>
            <span class="chip">${d.trajet.km === 0 ? "sur place" : `~${d.trajet.min} min · ${d.trajet.km} km`}</span>
            <span class="chip">${esc(d.duree)}</span>
            ${jour ? `<span class="chip day">📅 ${jourLisible(jour)}</span>` : ""}
          </div>
          <p>${esc(d.resume.slice(0, 135))}…</p>
          <div class="card-foot">
            <span>📍 ${d.aVoir.length} lieux</span>
            <span>💬 ${nb} commentaire${nb > 1 ? "s" : ""}</span>
          </div>
        </div>
      </button>`;
  }).join("");
}

/* ---------------- vue programme ---------------- */

function renderProgramme() {
  const prevus = DESTINATIONS.filter((d) => state.plan[d.id]).sort((a, b) =>
    state.plan[a.id].localeCompare(state.plan[b.id])
  );

  if (!prevus.length) {
    $("#programme").innerHTML = `
      <div class="block">
        <p class="empty">Rien de calé pour l'instant. Ouvre une destination et choisis une date :
        elle apparaîtra ici, pour tout le monde.</p>
      </div>`;
    return;
  }

  const parJour = {};
  prevus.forEach((d) => (parJour[state.plan[d.id]] ||= []).push(d));

  $("#programme").innerHTML = Object.entries(parJour)
    .map(([jour, dests]) => `
      <div class="day-group">
        <h3 class="day-title">${jourLisible(jour)}</h3>
        ${dests.map((d) => `
          <button class="day-item" data-dest="${d.id}" style="border-left-color:${d.couleur}">
            <span>${d.emoji}</span>
            <span class="n">${esc(d.nom)}</span>
            <span class="c">${d.trajet.km === 0 ? "sur place" : `~${d.trajet.min} min`} · 💬 ${commentairesDe(d.id).length}</span>
          </button>`).join("")}
      </div>`)
    .join("");
}

/* ---------------- feuille de détail ---------------- */

function renderSheet(destId) {
  const d = DESTINATIONS.find((x) => x.id === destId);
  if (!d) return;
  destOuverte = destId;

  const spots = d.aVoir.map((s, i) => {
    const gratuit = !s.prix.adulte && !s.prix.enfant && !s.prix.forfait;
    return `
      <div class="spot">
        <div class="spot-head">
          <input type="checkbox" data-spot="${i}" ${s.prix.optionnel ? "" : "checked"} aria-label="Compter ${esc(s.nom)}">
          <div>
            <div class="spot-name">${esc(s.nom)}</div>
            <div class="spot-detail">${esc(s.detail)}</div>
            <span class="spot-price${gratuit ? " free" : ""}">${esc(s.prix.label)}</span>
            <a class="spot-link" href="${esc(s.lien)}" target="_blank" rel="noopener">${esc(s.lienLabel)} ↗</a>
          </div>
        </div>
      </div>`;
  }).join("");

  const coms = commentairesDe(d.id);

  $("#sheet-scroll").innerHTML = `
    <div class="detail-hero" style="background:${d.couleur}">
      <div class="big-emoji">${d.emoji}</div>
      <h2>${esc(d.nom)}</h2>
      <div class="sub">${esc(d.sousTitre)}</div>
    </div>

    <div class="detail-body">
      <div class="block">
        <p class="lede">${esc(d.resume)}</p>
        <div class="meta" style="margin-top:12px">
          <span class="chip">${d.trajet.km === 0 ? "Sur place" : `🚗 ~${d.trajet.min} min · ${d.trajet.km} km depuis Binic`}</span>
          <span class="chip">⏱ ${esc(d.duree)}</span>
        </div>
        ${d.trajet.note ? `<p class="spot-detail" style="margin-top:8px">${esc(d.trajet.note)}</p>` : ""}
      </div>

      <div class="block">
        <h3>On y va quel jour ?</h3>
        <div class="day-picker">
          <input type="date" id="pick-day" value="${state.plan[d.id] || ""}">
          <button class="btn" id="save-day" type="button">Caler</button>
          ${state.plan[d.id] ? `<button class="btn ghost" id="clear-day" type="button">Retirer</button>` : ""}
        </div>
      </div>

      <div class="block">
        <h3>À voir &amp; tarifs</h3>
        <div class="calc">
          <label for="nb-a">Adultes</label>
          <input type="number" id="nb-a" min="0" max="30" value="${localStorage.getItem("bretagne.nbA") || 2}">
          <label for="nb-e">Enfants</label>
          <input type="number" id="nb-e" min="0" max="30" value="${localStorage.getItem("bretagne.nbE") || 0}">
        </div>
        ${spots}
        <div class="total">
          <span>Total estimé</span>
          <span style="text-align:right">
            <span id="total-val">—</span>
            <small>hors repas, essence et parkings non listés</small>
          </span>
        </div>
      </div>

      <div class="block">
        <h3>Bon à savoir</h3>
        <ul class="plain">${d.pratique.map((p) => `<li>${esc(p)}</li>`).join("")}</ul>
      </div>

      <div class="block">
        <h3>Ce qu'on en dit (${coms.length})</h3>
        <div id="com-list">
          ${coms.length
            ? coms.map(([key, c]) => `
              <div class="comment">
                <div class="avatar">${esc((c.auteur || "?").slice(0, 1).toUpperCase())}</div>
                <div style="flex:1">
                  <div class="comment-meta">${esc(c.auteur)} · ${quandLisible(c.ts)}</div>
                  <div class="comment-body">${esc(c.texte)}</div>
                </div>
                ${c.auteur === moi ? `<button class="comment-del" data-del="${esc(key)}" aria-label="Supprimer">🗑</button>` : ""}
              </div>`).join("")
            : `<p class="empty">Personne n'a encore donné son avis.</p>`}
        </div>
        <div style="margin-top:12px">
          <textarea id="com-text" placeholder="Ton avis, une idée d'horaire, un resto…"></textarea>
          <button class="btn" id="com-send" type="button" style="margin-top:8px">Envoyer</button>
        </div>
      </div>

      <div class="block">
        <h3>Sources</h3>
        <ul class="plain sources">
          ${d.sources.map((s) => `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.titre)} ↗</a></li>`).join("")}
        </ul>
        <p class="spot-detail" style="margin-top:10px">Tarifs relevés le ${VERIF}. Susceptibles d'avoir changé — le lien officiel fait foi.</p>
      </div>
    </div>`;

  $("#sheet").hidden = false;
  $("#sheet-scroll").scrollTop = 0;
  document.body.style.overflow = "hidden";
  brancherSheet(d);
  recalcTotal(d);
}

function recalcTotal(d) {
  const a = Number($("#nb-a").value) || 0;
  const e = Number($("#nb-e").value) || 0;
  localStorage.setItem("bretagne.nbA", a);
  localStorage.setItem("bretagne.nbE", e);

  let total = 0;
  document.querySelectorAll("[data-spot]").forEach((box) => {
    if (!box.checked) return;
    const p = d.aVoir[Number(box.dataset.spot)].prix;
    total += (p.adulte || 0) * a + (p.enfant || 0) * e + (p.forfait || 0);
  });

  $("#total-val").textContent = total === 0 ? "Gratuit" : euro(total);
}

function brancherSheet(d) {
  $("#nb-a").addEventListener("input", () => recalcTotal(d));
  $("#nb-e").addEventListener("input", () => recalcTotal(d));
  document.querySelectorAll("[data-spot]").forEach((box) =>
    box.addEventListener("change", () => recalcTotal(d))
  );

  $("#save-day").addEventListener("click", async () => {
    const val = $("#pick-day").value;
    if (!val) return badge("Choisis d'abord une date");
    await agir(() => pushPlan(d.id, val), "Journée calée ✓");
    renderSheet(d.id);
    renderGrid();
    renderProgramme();
  });

  const clr = $("#clear-day");
  if (clr) {
    clr.addEventListener("click", async () => {
      await agir(() => pushPlan(d.id, null), "Retiré du programme");
      renderSheet(d.id);
      renderGrid();
      renderProgramme();
    });
  }

  $("#com-send").addEventListener("click", async () => {
    const texte = $("#com-text").value.trim();
    if (!texte) return;
    if (!demanderPrenom()) return badge("Il faut un prénom pour commenter");
    await agir(
      () => pushComment({ dest: d.id, auteur: moi, texte: texte.slice(0, 1200), ts: Date.now() }),
      remote ? "Commentaire partagé ✓" : "Commentaire enregistré (ce téléphone)"
    );
    renderSheet(d.id);
    renderGrid();
    renderProgramme();
  });

  document.querySelectorAll("[data-del]").forEach((btn) =>
    btn.addEventListener("click", async () => {
      if (!confirm("Supprimer ce commentaire ?")) return;
      await agir(() => dropComment(btn.dataset.del), "Supprimé");
      renderSheet(d.id);
      renderGrid();
    })
  );
}

/* Enveloppe les écritures : message de confirmation ou d'échec réseau. */
async function agir(fn, ok) {
  try {
    await fn();
    badge(ok);
  } catch (err) {
    badge("Pas de réseau — gardé sur ce téléphone seulement", 3600);
  }
}

function fermerSheet() {
  $("#sheet").hidden = true;
  document.body.style.overflow = "";
  destOuverte = null;
}

/* ---------------- amorçage ---------------- */

function brancherGlobal() {
  document.addEventListener("click", (ev) => {
    const carte = ev.target.closest("[data-dest]");
    if (carte) renderSheet(carte.dataset.dest);
  });

  $("#sheet-close").addEventListener("click", fermerSheet);

  document.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape" && !$("#sheet").hidden) fermerSheet();
  });

  $("#who").addEventListener("click", () => demanderPrenom(true));

  document.querySelectorAll(".tab").forEach((tab) =>
    tab.addEventListener("click", () => {
      document.querySelectorAll(".tab").forEach((t) => t.classList.remove("is-on"));
      tab.classList.add("is-on");
      const cible = tab.dataset.view;
      $("#view-destinations").hidden = cible !== "destinations";
      $("#view-programme").hidden = cible !== "programme";
    })
  );
}

function repeindre() {
  renderGrid();
  renderProgramme();
  if (destOuverte && !$("#sheet").hidden) {
    // On ne réécrit pas la feuille si l'utilisateur est en train d'y taper.
    const zone = document.activeElement;
    if (!zone || (zone.tagName !== "TEXTAREA" && zone.tagName !== "INPUT")) renderSheet(destOuverte);
  }
}

async function synchroniser() {
  if (!remote) return;
  try {
    await pull();
    repeindre();
  } catch (_) {
    /* hors ligne : on reste sur la copie locale */
  }
}

async function demarrer() {
  loadLocal();
  majBoutonPrenom();
  brancherGlobal();
  renderGrid();
  renderProgramme();

  if (remote) {
    await synchroniser();
    setInterval(() => {
      if (document.visibilityState === "visible") synchroniser();
    }, 10000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") synchroniser();
    });
  } else {
    badge("Mode solo : commentaires gardés sur ce téléphone (voir README)", 4200);
  }
}

demarrer();

</script>
