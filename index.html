<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#072f3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bretagne">
<meta name="description" content="Nos journées en Bretagne : agenda de la semaine, lieux des Côtes-d'Armor et tarifs.">
<title>Nos journées en Bretagne</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div>
      <h1>Nos journées en Bretagne</h1>
      <p class="baseline">Base : Binic-Étables-sur-Mer · Côtes-d'Armor</p>
    </div>
    <button id="share" class="who share" type="button" aria-label="Partager le lien">⤴</button>
    <button id="who" class="who" type="button" aria-label="Changer de prénom">👤</button>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab is-on" data-view="semaine" role="tab">Semaine</button>
    <button class="tab" data-view="destinations" role="tab">Lieux</button>
  </nav>
</header>

<main>
  <section id="view-semaine" class="view">
    <div class="week-nav">
      <button class="week-arrow" id="week-prev" type="button" aria-label="Semaine précédente">‹</button>
      <div class="week-label">
        <strong id="week-range"></strong>
        <input type="date" id="week-start" aria-label="Samedi de début de séjour">
      </div>
      <button class="week-arrow" id="week-next" type="button" aria-label="Semaine suivante">›</button>
    </div>
    <div id="semaine"></div>
  </section>

  <section id="view-destinations" class="view" hidden>
    <button class="btn add-place" id="add-place" type="button">+ Ajouter un lieu</button>

    <div class="tri">
      <div class="tri-filtres" id="tri-filtres" role="group" aria-label="Filtrer par catégorie"></div>
      <label class="tri-ordre">
        <span>Trier par</span>
        <select id="tri-ordre" aria-label="Ordre de tri">
          <option value="distance">Distance</option>
          <option value="note">Note</option>
          <option value="prix">Prix</option>
          <option value="nom">Nom</option>
          <option value="recent">Ajout récent</option>
        </select>
      </label>
    </div>

    <div id="grid" class="grid"></div>
    <p class="footnote" id="hors-rayon"></p>
    <p class="footnote">
      Tarifs relevés le <strong>10/08/2026</strong> auprès des sites officiels — chaque prix est cliquable
      et renvoie à sa source. Les grilles changent en cours de saison : re-vérifiez avant de payer.
    </p>
  </section>
</main>

<div id="sheet" class="sheet" hidden>
  <div class="sheet-scroll" id="sheet-scroll"></div>
  <button id="sheet-close" class="sheet-close" type="button" aria-label="Fermer">✕</button>
</div>

<div id="picker" class="picker" hidden>
  <div class="picker-panel">
    <div class="picker-head">
      <strong id="picker-title">Ajouter au créneau</strong>
      <button id="picker-close" class="picker-close" type="button" aria-label="Fermer">✕</button>
    </div>
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<div id="drag-ghost" class="drag-ghost" hidden></div>

<div id="sync-badge" class="sync-badge" hidden></div>

<script src="config.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
  /* Hors ligne. Ignoré sur file:// et dans un cadre sans service worker.
     localhost est un contexte sécurisé au même titre que https : l'inclure
     permet de vérifier le comportement hors ligne avant de déployer. */
  const secure = location.protocol === "https:" || ["localhost", "127.0.0.1"].includes(location.hostname);
  if ("serviceWorker" in navigator && secure) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
